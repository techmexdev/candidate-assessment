<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;background:var(--ax-bg);font-family:var(--ax-font-body);color:var(--ax-ink);padding:20px;box-sizing:border-box}*{box-sizing:border-box}.micro{font-family:var(--ax-font-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ax-ink-3)}.pill{font-weight:600;font-size:13.5px;height:44px;padding:0 18px;border-radius:var(--ax-r-pill);border:none;display:inline-flex;align-items:center;cursor:pointer}</style></head><body>
<div style="display:flex;gap:14px">
<div style="flex:1;display:flex;flex-direction:column;gap:10px">
<span class="micro" style="background:var(--ax-signal-soft);border-radius:var(--ax-r-pill);padding:5px 10px;color:var(--ax-ink);align-self:flex-start;font-size:9px">CHURN RISK</span>
<span class="micro" style="background:var(--ax-signal);background-size:200% 100%;animation:ax-signal-shift 1.6s ease infinite;border-radius:var(--ax-r-pill);padding:5px 10px;color:var(--ax-ink);align-self:flex-start;font-size:9px">RETRIEVING MEMBER CONTEXT…</span>
<div style="height:12px;width:60%;background:var(--ax-signal-soft);background-size:200% 100%;animation:ax-signal-shift 1.6s ease infinite;border-radius:6px"></div>
<div style="height:12px;width:85%;background:var(--ax-signal-soft);background-size:200% 100%;animation:ax-signal-shift 1.6s ease infinite;border-radius:6px"></div>
<div style="display:flex;gap:6px;flex-wrap:wrap">
<span class="micro" style="border:var(--ax-border);border-radius:var(--ax-r-pill);padding:5px 10px;background:var(--ax-surface);letter-spacing:.04em">ADHERENCE LOG</span><span class="micro" style="border:var(--ax-border);border-radius:var(--ax-r-pill);padding:5px 10px;background:var(--ax-surface);letter-spacing:.04em">CHAT 05/30</span><span class="micro" style="border:var(--ax-border);border-radius:var(--ax-r-pill);padding:5px 10px;background:var(--ax-surface);letter-spacing:.04em">LOGIN EVENTS</span>
</div>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:6px">
<div class="micro" style="font-size:9px;letter-spacing:.16em">ANATOMY</div>
<div style="border:1px solid var(--ax-line-strong);background:linear-gradient(115deg,rgba(220,203,255,.18),rgba(191,229,255,.15) 38%,rgba(255,221,233,.13) 72%,rgba(227,255,214,.16)),var(--ax-surface);border-radius:var(--ax-r-md);padding:11px 13px">
<div style="font-size:13.5px;font-weight:500">patellofemoral joint ⊂ knee joint</div>
<div class="micro" style="font-size:9px;letter-spacing:.04em;margin-top:4px">SNOMED CT SUBSET · ANATOMY HIERARCHY</div>
</div>
<div style="text-align:center;color:var(--ax-line-strong);font-size:13px;line-height:1">↓</div>
<div class="micro" style="font-size:9px;letter-spacing:.16em">RULE</div>
<div style="border:var(--ax-border-dashed);border-radius:var(--ax-r-md);padding:11px 13px;font-size:12.5px;color:var(--ax-ink-4)">not used for this decision</div>
</div>
</div></body></html>
