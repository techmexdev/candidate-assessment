<!-- @dsCard group="Components" viewport="700x300" subtitle="Button · Chip · Card · Input · Segmented · TabBar · Toast" name="Core" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;background:var(--ax-bg);font-family:var(--ax-font-body);color:var(--ax-ink);padding:20px;box-sizing:border-box}*{box-sizing:border-box}.micro{font-family:var(--ax-font-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ax-ink-3)}.pill{font-weight:600;font-size:13.5px;height:44px;padding:0 18px;border-radius:var(--ax-r-pill);border:none;display:inline-flex;align-items:center;cursor:pointer}</style></head><body>
<div style="display:flex;flex-direction:column;gap:14px">
<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
<button class="pill" style="background:var(--ax-ink);color:var(--ax-on-ink)">Approve &amp; publish</button>
<button class="pill" style="background:var(--ax-surface);color:var(--ax-ink);border:1px solid var(--ax-line-strong)">Adjust</button>
<button class="pill" style="background:transparent;color:var(--ax-ink);border:1px solid var(--ax-ink)">Override…</button>
<button class="pill" style="background:var(--ax-disabled-bg);color:var(--ax-disabled-fg)">Disabled</button>
<span class="pill" style="background:var(--ax-ink);color:var(--ax-on-ink);font-size:13px;height:40px">Chip · selected</span>
<span class="pill" style="background:var(--ax-surface);color:var(--ax-ink-2);border:1px solid var(--ax-line-strong);font-size:13px;height:40px">Chip</span>
<span class="pill" style="background:var(--ax-surface-sub);color:var(--ax-ink-4);border:1px dashed var(--ax-line-strong);font-size:13px;height:40px">Chip · dashed</span>
</div>
<div style="display:flex;gap:12px">
<div style="flex:1.2;display:flex;flex-direction:column;gap:10px">
<input placeholder="Reason (required) — e.g. cleared by PT" style="font:13.5px var(--ax-font-body);color:var(--ax-ink);background:var(--ax-bg);border:var(--ax-border);border-radius:var(--ax-r-md);padding:12px 14px;height:44px;outline:none">
<div style="display:flex;gap:8px">
<button class="pill" style="flex:1;background:var(--ax-surface);color:var(--ax-ink-2);border:1px solid var(--ax-line-strong);border-radius:var(--ax-r-sm);justify-content:center">Light</button>
<button class="pill" style="flex:1;background:var(--ax-ink);color:var(--ax-on-ink);border-radius:var(--ax-r-sm);justify-content:center">Moderate</button>
<button class="pill" style="flex:1;background:var(--ax-surface);color:var(--ax-ink-2);border:1px solid var(--ax-line-strong);border-radius:var(--ax-r-sm);justify-content:center">Hard</button>
</div>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:10px;align-items:flex-start">
<div style="background:var(--ax-ink);color:var(--ax-on-ink);font-weight:600;font-size:13px;padding:11px 18px;border-radius:var(--ax-r-pill);box-shadow:var(--ax-shadow-float)">✓ Published to Jordan — exact v4</div>
<div style="display:flex;border-top:1px solid var(--ax-line-2);background:var(--ax-surface-sub);width:100%;border-radius:var(--ax-r-sm)">
<div style="flex:1;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px"><div style="width:18px;height:2.5px;border-radius:2px;background:var(--ax-ink);opacity:1"></div><span style="font-size:12.5px;font-weight:600;color:var(--ax-ink)">Today</span></div><div style="flex:1;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px"><div style="width:18px;height:2.5px;border-radius:2px;background:var(--ax-ink);opacity:0"></div><span style="font-size:12.5px;font-weight:600;color:var(--ax-ink-4)">Copilot</span></div><div style="flex:1;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px"><div style="width:18px;height:2.5px;border-radius:2px;background:var(--ax-ink);opacity:0"></div><span style="font-size:12.5px;font-weight:600;color:var(--ax-ink-4)">History</span></div>
</div>
</div>
</div>
</div></body></html>
