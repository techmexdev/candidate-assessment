<!-- @dsCard group="Spacing" viewport="700x180" subtitle="fade-up arrivals · Signal shimmer while working · press scale(.99)" name="Motion" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--ax-bg);font-family:var(--ax-font-body);color:var(--ax-ink);padding:20px;box-sizing:border-box}*{box-sizing:border-box}.micro{font:var(--ax-text-micro);font-family:var(--ax-font-mono);letter-spacing:var(--ax-track-micro);text-transform:uppercase;color:var(--ax-ink-3)}</style></head><body>
<div style="display:flex;gap:16px;align-items:center">
<div style="width:170px;background:var(--ax-surface);border:var(--ax-border);border-radius:var(--ax-r-md);padding:12px;animation:ax-fade-up .28s var(--ax-ease)"><div class="micro">FADE-UP · 280MS</div><div style="font:var(--ax-text-sub);color:var(--ax-ink-2);margin-top:4px">Arriving content</div></div>
<div style="display:flex;flex-direction:column;gap:8px;width:190px">
<span class="micro" style="background:var(--ax-signal);background-size:200% 100%;animation:ax-signal-shift 1.6s ease infinite;border-radius:var(--ax-r-pill);padding:5px 10px;color:var(--ax-ink);align-self:flex-start">RETRIEVING CONTEXT…</span>
<div style="height:10px;width:80%;background:var(--ax-signal-soft);background-size:200% 100%;animation:ax-signal-shift 1.6s ease infinite;border-radius:5px"></div>
</div>
<div style="font:var(--ax-text-sub);color:var(--ax-ink-3);max-width:180px">Ease (.2,.7,.2,1) · press scale(.99) · hover: border → ink. No bounces.</div>
</div></body></html>
