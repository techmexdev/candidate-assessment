<!-- @dsCard group="Colors" viewport="700x210" subtitle="in-workout / night — same tokens, dark scope" name="Carbon theme" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--ax-bg);font-family:var(--ax-font-body);color:var(--ax-ink);padding:20px;box-sizing:border-box}*{box-sizing:border-box}.micro{font:var(--ax-text-micro);font-family:var(--ax-font-mono);letter-spacing:var(--ax-track-micro);text-transform:uppercase;color:var(--ax-ink-3)}</style></head><body>
<div data-ax-theme="carbon" style="background:var(--ax-bg);border-radius:var(--ax-r-lg);padding:16px;display:flex;gap:12px;align-items:stretch">
<div style="flex:1;background:var(--ax-surface);border:1px solid var(--ax-line);border-radius:var(--ax-r-md);padding:12px;display:flex;flex-direction:column;gap:8px">
<span class="micro" style="background:var(--ax-signal-soft);border-radius:var(--ax-r-pill);padding:5px 10px;color:var(--ax-ink);align-self:flex-start">TODAY'S DRAFT · READY</span>
<div style="font:var(--ax-text-card-title);color:var(--ax-ink);letter-spacing:-0.015em">50-min knee-safe strength</div>
<button style="all:unset;background:var(--ax-ink);color:var(--ax-on-ink);font:600 13px var(--ax-font-body);height:38px;border-radius:var(--ax-r-pill);text-align:center;padding:0 16px;align-self:flex-start">Review &amp; approve →</button>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:8px;justify-content:center">
<div style="font:var(--ax-text-data);font-stretch:110%;color:var(--ax-ink);font-size:24px">6.3h</div>
<div class="micro">SLEEP AVG 7D · CARBON SCOPE VIA DATA-AX-THEME</div>
</div>
</div></body></html>
