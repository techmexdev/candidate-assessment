<!-- @dsCard group="Colors" viewport="700x200" subtitle="no red, no green; warnings are ink + glyph" name="Semantics — ink is human, Signal is machine" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--ax-bg);font-family:var(--ax-font-body);color:var(--ax-ink);padding:20px;box-sizing:border-box}*{box-sizing:border-box}.micro{font:var(--ax-text-micro);font-family:var(--ax-font-mono);letter-spacing:var(--ax-track-micro);text-transform:uppercase;color:var(--ax-ink-3)}</style></head><body>
<div style="display:flex;gap:12px;align-items:stretch">
<div style="flex:1;background:var(--ax-surface);border:var(--ax-border);border-radius:var(--ax-r-md);padding:12px;display:flex;flex-direction:column;gap:8px">
<button style="all:unset;background:var(--ax-action);color:var(--ax-on-action);font:600 13px var(--ax-font-body);height:40px;border-radius:var(--ax-r-pill);text-align:center">Approve &amp; publish</button>
<div style="display:flex;gap:8px;align-items:center"><span style="width:22px;height:22px;border-radius:50%;background:var(--ax-ink);color:var(--ax-on-ink);display:inline-flex;align-items:center;justify-content:center;font:700 12px var(--ax-font-body)">!</span><span style="font:var(--ax-text-sub);color:var(--ax-ink-2)">Warning — carbon + glyph</span></div>
<div class="micro">HUMAN · INK</div>
</div>
<div style="flex:1;background:linear-gradient(115deg,rgba(220,203,255,.32),rgba(191,229,255,.28) 38%,rgba(255,221,233,.26) 72%,rgba(227,255,214,.3)),var(--ax-surface);border:var(--ax-border);border-radius:var(--ax-r-md);padding:12px;display:flex;flex-direction:column;gap:8px">
<span class="micro" style="background:var(--ax-signal);border-radius:var(--ax-r-pill);padding:5px 10px;color:var(--ax-ink);align-self:flex-start">GRAPH DECISION</span>
<div style="font:var(--ax-text-sub);color:var(--ax-ink-2)">Provenance, decision paths, retrieval, suggested actions.</div>
<div class="micro">MACHINE · SIGNAL</div>
</div>
</div></body></html>
